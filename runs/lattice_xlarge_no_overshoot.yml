# Same as lattice_xlarge_asexual.yml but with REPRODUCTION_REGULATION: True
# so the population cannot exceed RESOURCE_MAXIMUM_AMOUNT at any step.
#
# Question being tested: with no overshoot crash, does founder fixation
# still happen by step 700 (=> spatial drift is the real dynamic), or do
# founders persist much longer / never fully fix (=> the original montage's
# rapid collapse was mostly resource-crash demographic noise)?

RANDOM_SEED: 11
STEPS_PER_SIMULATION: 1000
AGE_LIMIT: 20
INITIAL_POPULATION_SIZE: 5000
LOGGING_RATE: 100

PICKLE_RATE: 0
CHECKPOINT_RATE: 0
SNAPSHOT_RATE: 0
INTERVAL_RATE: 0
POPGENSTATS_RATE: 0
LATTICE_RECORD_RATE: 20    # same as xlarge: 50 frames
LINEAGE_TRACING: true
LINEAGE_RATE: 1

# Spatial model — same as xlarge
LATTICE_MODE: true
LATTICE_TARGET_DENSITY: 0.125
MIGRATION_RATE: 0.05
MIGRATION_LONG_RATE: 0.001

REPRODUCTION_MODE: asexual
MATURATION_AGE: 3
MAX_OFFSPRING_NUMBER: 2
REPRODUCTION_REGULATION: true     # <-- the key difference: caps offspring at remaining capacity

BITS_PER_LOCUS: 8
ENVDRIFT_RATE: 0
G_surv_lo: 0.9
G_repr_hi: 1.0

ABIOTIC_HAZARD_OFFSET: 0
ABIOTIC_HAZARD_AMPLITUDE: 0
ABIOTIC_HAZARD_SHAPE: flat

RESOURCE_INITIAL_AMOUNT: 5000
RESOURCE_MAXIMUM_AMOUNT: 5000
RESOURCE_ADDITIVE_GROWTH: 1000
