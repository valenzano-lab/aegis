# Pop2 equilibrium — small N (K=500, defined by resources)
# Run to 50K steps; final pickle used as introgression source in hybrid runs

RANDOM_SEED: 43
STEPS_PER_SIMULATION: 50000
AGE_LIMIT: 30
INITIAL_POPULATION_SIZE: 100

SNAPSHOT_RATE: 5000
SNAPSHOT_FINAL_COUNT: 5
INTERVAL_RATE: 1000
POPGENSTATS_RATE: 5000
PICKLE_RATE: 50000
CHECKPOINT_RATE: 5000

MATURATION_AGE: 5
MAX_OFFSPRING_NUMBER: 2
REPRODUCTION_MODE: sexual
RECOMBINATION_RATE: 0.1

BITS_PER_LOCUS: 8
G_surv_initgeno: 0.5
G_surv_lo: 0.8
G_surv_hi: 1.0
G_repr_initgeno: 0.5

ABIOTIC_HAZARD_OFFSET: 0.02
ABIOTIC_HAZARD_AMPLITUDE: 0
ABIOTIC_HAZARD_SHAPE: flat

RESOURCE_INITIAL_AMOUNT: 500
RESOURCE_MAXIMUM_AMOUNT: 500
RESOURCE_ADDITIVE_GROWTH: 500
RESOURCE_MULTIPLICATIVE_GROWTH: 0

STARVATION_PENALTY: 0.1
