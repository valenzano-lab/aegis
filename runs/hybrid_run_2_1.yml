# Hybrid run 2→1: 10% pop2 seeds spiked into pop1 environment (K=5000)
# Tracks fate of small-N (pop2) variants in large-N (pop1) background
# Run: aegis sim -c runs/hybrid_run_2_1.yml -p runs/pop1_equilibrium/pickles/50000

RANDOM_SEED: 101
STEPS_PER_SIMULATION: 50000
AGE_LIMIT: 30
INITIAL_POPULATION_SIZE: 5000

SNAPSHOT_RATE: 1000
SNAPSHOT_FINAL_COUNT: 10
INTERVAL_RATE: 500
POPGENSTATS_RATE: 1000
PICKLE_RATE: 0
CHECKPOINT_RATE: 5000

MATURATION_AGE: 5
MAX_OFFSPRING_NUMBER: 2
REPRODUCTION_MODE: sexual
RECOMBINATION_RATE: 0.1

BITS_PER_LOCUS: 8
G_surv_initgeno: 0.5
G_surv_lo: 0.8
G_surv_hi: 1.0
G_repr_initgeno: 0.5

ABIOTIC_HAZARD_OFFSET: 0.02
ABIOTIC_HAZARD_AMPLITUDE: 0
ABIOTIC_HAZARD_SHAPE: flat

# Pop1 environment (large N)
RESOURCE_INITIAL_AMOUNT: 5000
RESOURCE_MAXIMUM_AMOUNT: 5000
RESOURCE_ADDITIVE_GROWTH: 5000
RESOURCE_MULTIPLICATIVE_GROWTH: 0

STARVATION_PENALTY: 0.1

# Introgression: 10% of K=5000 = 500 seeds from pop2
INTROGRESSION_SOURCE: runs/pop2_equilibrium/pickles/50000
INTROGRESSION_SEEDS: 500
