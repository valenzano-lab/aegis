# LATTICE_MODE=true sexual reproduction smoke test.
# Mates within MATING_MAX_SEARCH_RADIUS rings; offspring placed adjacent to mother.

RANDOM_SEED: 7
STEPS_PER_SIMULATION: 30
AGE_LIMIT: 10
INITIAL_POPULATION_SIZE: 50
LOGGING_RATE: 5

PICKLE_RATE: 0
CHECKPOINT_RATE: 0
SNAPSHOT_RATE: 0
INTERVAL_RATE: 0
POPGENSTATS_RATE: 0
LATTICE_RECORD_RATE: 2
# LINEAGE_TRACING off for sexual reproduction — clonal lineages don't make
# biological sense under sexual reproduction. See "Lineage tracing" in the
# manual: each sexual offspring has two parents, so a single lineage_id can
# only capture matrilineal OR patrilineal descent, not genetic ancestry.
# For sexual sims, use post-hoc analysis on FASTA / VCF / pickle snapshots.

# Spatial model
LATTICE_MODE: true
LATTICE_TARGET_DENSITY: 0.2
MIGRATION_RATE: 0.1
MIGRATION_LONG_RATE: 0.005
MATING_MAX_SEARCH_RADIUS: 3

# Sexual reproduction — exercises the new lattice-aware pairing path
REPRODUCTION_MODE: sexual
RECOMBINATION_RATE: 0.1
MATURATION_AGE: 2
MAX_OFFSPRING_NUMBER: 1

BITS_PER_LOCUS: 8
ENVDRIFT_RATE: 0
G_surv_lo: 0.9
G_repr_hi: 1.0

ABIOTIC_HAZARD_OFFSET: 0
ABIOTIC_HAZARD_AMPLITUDE: 0
ABIOTIC_HAZARD_SHAPE: flat

RESOURCE_INITIAL_AMOUNT: 100
RESOURCE_MAXIMUM_AMOUNT: 100
RESOURCE_ADDITIVE_GROWTH: 30
# Resources sized to match initial pop so density at carrying capacity is
# close to LATTICE_TARGET_DENSITY. Pushing resources much higher leaves the
# lattice too sparse for sexual mating at small N — strong Allee effect.
