# Tiny sim for FASTA round-trip validation.
# Goal: produce a final-step pickle that we can encode to FASTA, decode back,
# and check that genome bits + architect-derived phenotypes are identical.
#
# ENVDRIFT off so the architect is deterministic given the genome array
# (no time-evolving envdrift state to snapshot).

RANDOM_SEED: 42
STEPS_PER_SIMULATION: 200
AGE_LIMIT: 20
INITIAL_POPULATION_SIZE: 200

PICKLE_RATE: 0          # writes only at last step
SNAPSHOT_RATE: 0
INTERVAL_RATE: 0
POPGENSTATS_RATE: 0
CHECKPOINT_RATE: 0

MATURATION_AGE: 3
MAX_OFFSPRING_NUMBER: 2
REPRODUCTION_MODE: sexual
RECOMBINATION_RATE: 0.1

BITS_PER_LOCUS: 8
ENVDRIFT_RATE: 0

ABIOTIC_HAZARD_OFFSET: 0.02
ABIOTIC_HAZARD_AMPLITUDE: 0
ABIOTIC_HAZARD_SHAPE: flat

RESOURCE_INITIAL_AMOUNT: 200
RESOURCE_MAXIMUM_AMOUNT: 2000
RESOURCE_ADDITIVE_GROWTH: 200
